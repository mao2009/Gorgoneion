name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Gorgoneion.Cli/Gorgoneion.Cli.csproj -c Release
      - run: dotnet run --project tests/Gorgoneion.SmokeTests/Gorgoneion.SmokeTests.csproj -c Release
      - run: dotnet run --project src/Gorgoneion.Cli/Gorgoneion.Cli.csproj -c Release -- evaluate --policy examples/policy.example.json --input examples/eve.example.jsonl
