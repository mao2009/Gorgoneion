name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Gorgoneion.sln -c Release
      - run: dotnet run --project tests/Gorgoneion.SmokeTests/Gorgoneion.SmokeTests.csproj -c Release
      - run: dotnet run --project src/Gorgoneion.Cli/Gorgoneion.Cli.csproj -c Release -- evaluate --policy examples/policy.example.json --authorization examples/authorization.example.json --input examples/eve.example.jsonl --audit "$RUNNER_TEMP/gorgoneion-audit.jsonl"
      - run: dotnet run --project src/Gorgoneion.Cli/Gorgoneion.Cli.csproj -c Release -- verify-audit --input "$RUNNER_TEMP/gorgoneion-audit.jsonl"
      - run: dotnet run --project src/Gorgoneion.Cli/Gorgoneion.Cli.csproj -c Release -- evaluate --policy examples/policy.example.json --authorization examples/authorization.example.json --input examples/eve.example.jsonl --audit "$RUNNER_TEMP/gorgoneion-strategy-audit.jsonl" --strategies examples/strategies.example.json
      - run: dotnet run --project src/Gorgoneion.Cli/Gorgoneion.Cli.csproj -c Release -- verify-audit --input "$RUNNER_TEMP/gorgoneion-strategy-audit.jsonl"
